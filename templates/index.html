<!DOCTYPE html>

<html>

<head>

<title>Student Registration</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

<h2>Student Registration</h2>

<form action="/register" method="POST">

<label>Name</label>

<input
type="text"
name="name"
required>

<label>USN</label>

<input
type="text"
name="usn"
required>

<label>Department</label>

<input
type="text"
name="dept"
required>

<input
type="submit"
value="Register">

</form>

</div>

<script src="/static/script.js"></script>

</body>

</html>
